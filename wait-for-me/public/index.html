<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1F3D">
<meta name="description" content="Book someone to hold your spot in line, or get paid to wait.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wait For Me!">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Wait For Me!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single phone-width app column; a role switch on top, a "take-a-number" ticket as the signature element */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --ink:#1A1F3D; --muted:#5D6485; --line:#D9DCE8;
  --ticket:#FFC21A; --ticket-ink:#2A1E00; --primary:#1A1F3D; --on-primary:#FFFFFF;
  --good:#1D8A55; --good-bg:#DDF3E7; --warn:#B45309; --warn-bg:#FDEBD3; --info:#2F45D8; --info-bg:#E2E6FC;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10132A; --surface:#1A1F3D; --ink:#ECEEF8; --muted:#A3A9C9; --line:#2D3359;
  --ticket:#FFC933; --ticket-ink:#2A1E00; --primary:#FFC933; --on-primary:#1A1F3D;
  --good:#5BD49A; --good-bg:#16382A; --warn:#F5A65B; --warn-bg:#3E2A14; --info:#9DABFF; --info-bg:#252C5A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132A; --surface:#1A1F3D; --ink:#ECEEF8; --muted:#A3A9C9; --line:#2D3359;
  --ticket:#FFC933; --ticket-ink:#2A1E00; --primary:#FFC933; --on-primary:#1A1F3D;
  --good:#5BD49A; --good-bg:#16382A; --warn:#F5A65B; --warn-bg:#3E2A14; --info:#9DABFF; --info-bg:#252C5A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 20px}
.screen-title{font-family:var(--f-body);font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.1;padding-top:4px}
button,a,.card{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:no-preference){button:active{transform:scale(.97)}button{transition:transform .08s}}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.appbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo .stub{font-family:var(--f-display);background:var(--ticket);color:var(--ticket-ink);padding:3px 6px;border-radius:3px;font-size:11px;transform:rotate(-4deg)}
.logo h1{font-family:var(--f-display);font-size:17px;font-weight:400;white-space:nowrap}
.sample{font-size:12px;color:var(--muted)}

.roles{display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:10px;padding:3px;gap:2px;flex:none}
.roles button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);min-height:32px}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .14)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-block:6px 4px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-height:50px;position:relative}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{stroke-width:2.3}
.tabbar button[aria-selected="true"] .ic{background:var(--ticket);color:var(--ticket-ink)}
.ic{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;position:relative}
.tabbar .plus .ic{background:var(--primary);color:var(--on-primary)}
.badge{position:absolute;top:-3px;right:6px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:10px;font-weight:800;display:grid;place-items:center;font-family:var(--f-mono)}

.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.row>div{min-width:0}
.card h3{font-size:17px;font-weight:700;line-height:1.3}
.meta{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.open{background:var(--info-bg);color:var(--info)}
.pill.active{background:var(--warn-bg);color:var(--warn)}
.pill.ready{background:var(--ticket);color:var(--ticket-ink)}
.pill.done{background:var(--good-bg);color:var(--good)}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.facts div{display:flex;flex-direction:column}
.facts span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}

/* signature: take-a-number ticket */
.ticket{--n:8px;background:var(--ticket);color:var(--ticket-ink);display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:6px;
  -webkit-mask:radial-gradient(circle var(--n) at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle var(--n) at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .num{font-family:var(--f-display);font-size:40px;line-height:1;min-width:2.2ch;text-align:center}
.ticket .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.75}
.ticket .txt{font-weight:600;font-size:14px;line-height:1.35}
.ticket .sep{width:0;align-self:stretch;border-left:2px dashed color-mix(in srgb,var(--ticket-ink) 35%,transparent)}

.steps{display:flex;gap:4px;list-style:none;padding:0;margin:0}
.steps li{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps li.on{background:var(--ticket)}
.stepnote{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stepnote b{color:var(--ink)}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

form.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field small{color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quote{background:var(--bg);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.quote div{display:flex;justify-content:space-between}
.quote .total{font-weight:800;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.earn{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;gap:10px;flex-wrap:wrap}
.earn b{font-family:var(--f-display);font-weight:400;font-size:28px}
.pos{display:flex;gap:6px;align-items:center}
.pos input{width:76px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:14px}
.who{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.who>div{min-width:0}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;border:3px solid var(--ticket)}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--good);background:var(--good-bg);padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:2px}
.look{font-size:13px;margin-top:2px}
.look b{font-weight:700}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codebox input{width:110px;letter-spacing:.3em;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:18px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.hint{font-size:12px;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv>div{min-width:0}
.kv small{display:block;color:var(--muted);font-size:12px}
.card-brand{font-family:var(--f-mono);font-weight:700}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:center;font-size:14px}
.checks li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;font-weight:800;font-size:12px}
.btn{min-height:44px;border-radius:12px}
.btn.small{min-height:36px;border-radius:10px}
.toast{z-index:7;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:420px){.two{grid-template-columns:1fr}.ticket .num{font-size:32px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card.flash{border-color:var(--ticket)}}
</style>
</head>
<body>

<style>
.auth{display:flex;flex-direction:column;gap:16px}
.auth .pitch{font-size:16px;color:var(--muted);max-width:40ch}
.auth .ticket{align-self:flex-start}
.switch{background:none;border:0;color:var(--info);font-weight:700;padding:6px 0;text-align:left}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
</style>
<header class="appbar"><div class="appbar-in gutter">
  <div class="logo"><span class="stub">No.1</span><h1>Wait For Me!</h1></div>
  <div class="roles" role="group" aria-label="Choose a side" id="roles" hidden>
    <button id="role-customer" aria-pressed="true" data-role="customer">Book</button>
    <button id="role-waiter" aria-pressed="false" data-role="waiter">Earn</button>
  </div>
</div></header>
<main class="app gutter">
  <h2 class="screen-title" id="screenTitle"></h2>
  <div id="view"><div class="loading">Loading…</div></div>
</main>
<nav class="tabbar" aria-label="Sections" id="tabbar" hidden><div class="tabbar-in gutter" role="tablist" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const STAGES=[
 {k:'open',label:'Waiting for a waiter',short:'Posted'},
 {k:'claimed',label:'Waiter booked',short:'Booked'},
 {k:'enroute',label:'Waiter on the way',short:'On the way'},
 {k:'inline',label:'Holding your spot',short:'In line'},
 {k:'nearfront',label:'Almost at the front',short:'Near front'},
 {k:'handoff',label:'Ready for the swap',short:'Swap'},
 {k:'done',label:'Done',short:'Done'}];
const idx=k=>STAGES.findIndex(s=>s.k===k);
const FEE=0.15;
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000)}
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};

let me=null, role=store.get('wfm_role')==='waiter'?'waiter':'customer', tab={customer:'mine',waiter:'find'}, filter='All', authMode='signup';
let data={mine:[],open:[],shifts:[]}, lastJSON='';

async function api(path,{method='GET',body}={}){
  let r;
  try{r=await fetch('/api'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'})}
  catch{throw new Error('You seem to be offline. Check your connection and try again.')}
  let j={};try{j=await r.json()}catch{}
  if(r.status===401&&path!=='/login'){me=null;render()}
  if(!r.ok)throw new Error(j.error||'Something went wrong. Try again.');
  return j;
}

// ---------- shared bits ----------
function pillFor(s){
  if(s==='open')return'<span class="pill open">Open</span>';
  if(s==='handoff')return'<span class="pill ready">Ready for swap</span>';
  if(s==='done')return'<span class="pill done">Done</span>';
  return`<span class="pill active">${STAGES[idx(s)].short}</span>`}
function steps(s){const i=idx(s);return`<ol class="steps" aria-label="Progress: ${STAGES[i].label}">${STAGES.slice(1).map((st,j)=>`<li class="${j+1<=i?'on':''}" title="${st.short}"></li>`).join('')}</ol>`}
function facts(j,mode){
  const pay=j.hours*j.rate,total=mode==='customer'?pay*(1+FEE):pay;
  return`<div class="facts"><div><span>Starts</span><b>${esc(j.startText)}</b></div><div><span>Est. wait</span><b>${j.hours} hr</b></div><div><span>${mode==='customer'?'You pay':'You earn'}</span><b>${money(total)}</b></div></div>`}
function whoCard(name,sub,look){
  return`<div class="who"><div class="avatar" aria-hidden="true">${esc(initials(name))}</div><div><b>${esc(name)}</b><div class="meta">${esc(sub)}</div>
    ${look!==undefined?`<div class="look">${look?`Look for: <b>${esc(look)}</b>`:'They haven\'t said what they\'re wearing yet.'}</div>`:''}</div></div>`}

// ---------- tabs ----------
const svg=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICONS={
 mine:svg('<path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path d="M14.5 7v2M14.5 11v2M14.5 15v2"/>'),
 post:svg('<path d="M12 6v12M6 12h12"/>'),
 account:svg('<circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.3-3.4 3.9-5 7-5s5.7 1.6 7 5"/>'),
 find:svg('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'),
 shifts:svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4.2l2.8 1.8"/>')};
const TITLES={mine:'My lines',post:'Post a line',account:'Account',find:'Find lines',shifts:'My shifts'};
function renderTabs(){
  const mine=data.mine.filter(j=>j.status!=='done').length, open=data.open.length, shifts=data.shifts.filter(j=>j.status!=='done').length;
  const t=role==='customer'?[['mine','My lines',mine],['post','Post',0],['account','Account',0]]:[['find','Find lines',open],['shifts','My shifts',shifts],['account','Account',0]];
  $('#tabs').innerHTML=t.map(([k,l,c])=>`<button role="tab" id="tab-${k}" class="${k==='post'?'plus':''}" aria-selected="${tab[role]===k}" data-k="${k}"><span class="ic">${ICONS[k]}${c?`<span class="badge">${c}</span>`:''}</span>${l}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(tab[role]!==b.dataset.k){tab[role]=b.dataset.k;render();window.scrollTo(0,0)}});
}
function setRole(r){if(r===role)return;role=r;store.set('wfm_role',r);render();window.scrollTo(0,0)}
document.querySelectorAll('.roles button').forEach(b=>b.addEventListener('click',()=>setRole(b.dataset.role)));

// ---------- screens ----------
function authScreen(){
  const up=authMode==='signup';
  return`<div class="auth">
   <div class="ticket"><div><div class="lbl">Now serving</div><div class="num">You</div></div><div class="sep"></div><div class="txt">Book someone to hold your spot in line, or get paid to wait.</div></div>
   <form class="post" id="authForm" novalidate>
    ${up?`<div class="field"><label for="a-name">Your name</label><input id="a-name" autocomplete="name" placeholder="First name and last initial"></div>`:''}
    <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" inputmode="email"></div>
    <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="${up?'At least 8 characters':''}"></div>
    <button class="btn block" type="submit">${up?'Create account':'Sign in'}</button>
    <span class="meta" id="authErr" role="alert"></span>
   </form>
   <button class="switch" id="authSwitch">${up?'Already have an account? Sign in':'New here? Create an account'}</button></div>`}

function customerMine(){
  const mine=data.mine.slice().sort((a,b)=>(a.status==='done')-(b.status==='done'));
  if(!mine.length)return`<div class="empty">No lines yet. Tap <b>Post</b> to have someone hold your spot.</div>`;
  return`<div class="list">${mine.map(j=>{
    const i=idx(j.status);let ticket='',actions='';
    if(j.status==='inline'||j.status==='nearfront')ticket=`<div class="ticket"><div><div class="lbl">Place</div><div class="num">${j.pos??'—'}</div></div><div class="sep"></div><div class="txt">${esc(j.waiterName)} is holding your spot. ${j.status==='nearfront'?'Head over now.':'You\'ll see it here when they\'re close.'}</div></div>`;
    if(j.status==='handoff')ticket=`<div class="ticket"><div><div class="lbl">Swap code</div><div class="num">${esc(j.code)}</div></div><div class="sep"></div><div class="txt">${esc(j.waiterName)} is at the front. Find them and read out this code. They enter it to hand over your spot.</div></div>`;
    else if(j.waiterId&&j.status!=='done')ticket+=`<div class="hint">Your swap code is <b class="mono">${esc(j.code)}</b>. Only share it in person when you take over the spot.</div>`;
    if(j.status==='open')actions=`<button class="btn ghost small" data-act="cancel" data-id="${j.id}">Cancel request</button>`;
    if(j.status==='done')actions=`<span class="meta">Completed with ${esc(j.waiterName)} · ${money(j.hours*j.rate*(1+FEE))}</span>`;
    return`<article class="card"><div class="row"><div><h3>${esc(j.place)}</h3><div class="meta">${esc(j.what)}</div></div>${pillFor(j.status)}</div>
      ${j.status!=='open'?steps(j.status):''}
      <div class="stepnote"><span><b>${STAGES[i].label}</b></span><span>${j.waiterId?'Your waiter':'Visible to waiters now'}</span></div>
      ${j.waiterId&&j.status!=='done'?whoCard(j.waiterName,'Your waiter',j.waiterLook||''):''}${ticket}${facts(j,'customer')}${actions?`<div class="btns">${actions}</div>`:''}</article>`}).join('')}</div>`}

function customerPost(){
  return`<form class="post" id="postForm" novalidate>
   <div class="meta">Tell waiters where to go and how long you expect it to take.</div>
   <div class="field"><label for="f-place">Where is the line?</label><input id="f-place" maxlength="120" placeholder="e.g. Taco truck at Grand Park"></div>
   <div class="field"><label for="f-what">What's it for?</label><input id="f-what" maxlength="120" placeholder="e.g. Lunch for 2, opening day"></div>
   <div class="two"><div class="field"><label for="f-cat">Type</label><select id="f-cat"><option>Food</option><option>Releases</option><option>Errands</option><option>Events</option></select></div>
   <div class="field"><label for="f-start">When should they arrive?</label><input id="f-start" maxlength="40" placeholder="Sat 9:00 AM"></div></div>
   <div class="two"><div class="field"><label for="f-hours">Estimated wait (hours)</label><input id="f-hours" type="number" min="0.5" max="24" step="0.5" value="2" inputmode="decimal"></div>
   <div class="field"><label for="f-rate">Hourly rate</label><input id="f-rate" type="number" min="15" max="200" step="1" value="20" inputmode="numeric"><small>Minimum $15/hr</small></div></div>
   <div class="field"><label for="f-notes">Notes for your waiter</label><textarea id="f-notes" rows="2" maxlength="500" placeholder="When you'll arrive, how to reach you, anything to buy"></textarea></div>
   <div class="quote" id="quote"></div>
   <button class="btn block" type="submit">Post line</button><span class="meta" id="formErr" role="alert"></span></form>`}
function updateQuote(){
  const h=+$('#f-hours').value||0,r=+$('#f-rate').value||0,base=h*r,fee=base*FEE;
  $('#quote').innerHTML=`<div><span>Waiter pay (${h} hr × ${money(r)})</span><span class="mono">${money(base)}</span></div><div><span>Service fee (15%)</span><span class="mono">${money(fee)}</span></div><div class="total"><span>Estimated total</span><span class="mono">${money(base+fee)}</span></div>`}

function waiterFind(){
  const cats=['All','Food','Releases','Errands','Events'];
  const open=data.open.filter(j=>filter==='All'||j.cat===filter);
  return`<div class="list"><div class="filters" role="group" aria-label="Filter by type">${cats.map(c=>`<button class="chip" aria-pressed="${filter===c}" data-cat="${c}">${c}</button>`).join('')}</div>
   ${open.length?open.map(j=>`<article class="card"><div class="row"><div><h3>${esc(j.place)}</h3><div class="meta">${esc(j.what)} · posted by ${esc(j.ownerName)}</div></div><span class="pill open">${money(j.rate)}/hr</span></div>
     ${j.notes?`<div class="meta">“${esc(j.notes)}”</div>`:''}${facts(j,'waiter')}
     <button class="btn small" data-act="claim" data-id="${j.id}">Claim this line</button></article>`).join(''):`<div class="empty">No open lines${filter==='All'?'':' in this category'} right now. New ones show up here automatically.</div>`}</div>`}

function waiterShifts(){
  const mine=data.shifts.slice().sort((a,b)=>(a.status==='done')-(b.status==='done'));
  const pending=mine.filter(j=>j.status!=='done').reduce((s,j)=>s+j.hours*j.rate,0);
  const earned=mine.filter(j=>j.status==='done').reduce((s,j)=>s+j.hours*j.rate,0);
  const verbs={enroute:'I\'m on my way',inline:'I\'m in line',nearfront:'I\'m near the front',handoff:'I\'m at the front'};
  return`<div class="list"><div class="earn"><div><div class="meta">Earned so far</div><b class="mono">${money(earned)}</b></div><div class="meta">${money(pending)} on active shifts</div></div>
   ${mine.length?mine.map(j=>{
     const i=idx(j.status),next=STAGES[i+1];let ctl='';
     if(next&&verbs[next.k])ctl+=`<button class="btn small" data-act="advance" data-id="${j.id}">${verbs[next.k]}</button>`;
     if(j.status==='claimed'||j.status==='enroute')ctl+=`<button class="btn ghost small" data-act="release" data-id="${j.id}">Release line</button>`;
     if(j.status==='inline'||j.status==='nearfront')ctl+=`<span class="pos"><label class="meta" for="pos-${j.id}">Place in line</label><input class="mono" id="pos-${j.id}" type="number" min="1" inputmode="numeric" value="${j.pos??''}"><button class="btn ghost small" data-act="position" data-id="${j.id}">Update</button></span>`;
     if(j.status==='handoff')ctl+=`<div class="codebox" style="width:100%"><label class="meta" for="code-${j.id}" style="width:100%">Ask ${esc(j.ownerName)} for their 4-digit swap code, then enter it to hand over the spot.</label><input id="code-${j.id}" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"><button class="btn small" data-act="swap" data-id="${j.id}">Complete swap</button></div>`;
     if(j.status==='done')ctl=`<span class="meta">Earned ${money(j.hours*j.rate)}</span>`;
     const outfit=j.status!=='done'?`<div class="codebox"><label class="meta" for="outfit-${j.id}" style="width:100%">What you're wearing, so ${esc(j.ownerName)} can spot you. Pick something easy to see.</label><input id="outfit-${j.id}" style="flex:1;min-width:0;letter-spacing:0;text-align:left;font-family:var(--f-body);font-weight:500;font-size:14px" maxlength="120" value="${esc(me.look)}" placeholder="e.g. Red cap, blue jacket"><button class="btn ghost small" data-act="outfit" data-id="${j.id}">Save</button></div>`:'';
     return`<article class="card"><div class="row"><div><h3>${esc(j.place)}</h3><div class="meta">${esc(j.what)}</div></div>${pillFor(j.status)}</div>
       ${steps(j.status)}<div class="stepnote"><span><b>${STAGES[i].short}</b></span>${j.pos?`<span>Place in line: <b class="mono">${j.pos}</b></span>`:''}</div>
       ${j.status!=='done'?whoCard(j.ownerName,'Your customer'):''}${outfit}
       ${j.notes?`<div class="meta">“${esc(j.notes)}”</div>`:''}${facts(j,'waiter')}<div class="btns">${ctl}</div></article>`}).join(''):`<div class="empty">No shifts yet. Claim a line from <b>Find lines</b>.</div>`}</div>`}

function account(){
  const done=data.mine.filter(j=>j.status==='done');
  return`<div class="list">
  <article class="card">${whoCard(me.name,me.email)}</article>
  <article class="card section"><h2>What you wear when waiting</h2>
    <div class="codebox"><label class="meta" for="acct-look" style="width:100%">Customers see this so they can find you in line.</label><input id="acct-look" style="flex:1;min-width:0;letter-spacing:0;text-align:left;font-family:var(--f-body);font-weight:500;font-size:14px" maxlength="120" value="${esc(me.look)}" placeholder="e.g. Red cap, blue jacket"><button class="btn ghost small" data-act="outfit">Save</button></div></article>
  <article class="card section"><h2>Payments</h2>
    <div class="note">Card payments and waiter payouts aren't switched on yet. For now, settle up directly with each other. Prices shown include the 15% service fee you'll charge once payments are live.</div></article>
  ${done.length?`<article class="card section"><h2>Completed lines</h2>${done.map(j=>{const b=j.hours*j.rate;return`<div class="kv"><div>${esc(j.place)}<small>Waiter ${money(b)} + service fee ${money(b*FEE)}</small></div><b class="mono">${money(b*(1+FEE))}</b></div>`}).join('')}</article>`:''}
  <button class="btn ghost block" data-act="logout">Sign out</button></div>`}

// ---------- render ----------
function render(){
  const signedIn=!!me;
  $('#roles').hidden=!signedIn;$('#tabbar').hidden=!signedIn;
  const v=$('#view');
  if(!signedIn){
    $('#screenTitle').textContent=authMode==='signup'?'Create your account':'Sign in';
    v.innerHTML=authScreen();
    $('#authSwitch').onclick=()=>{authMode=authMode==='signup'?'login':'signup';render()};
    $('#authForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
      try{const body={email:$('#a-email').value,password:$('#a-pass').value};if(authMode==='signup')body.name=$('#a-name').value;
        me=(await api(authMode==='signup'?'/signup':'/login',{method:'POST',body})).user;await load(true);toast(authMode==='signup'?`Welcome, ${me.name.split(' ')[0]}.`:'Signed in.')}
      catch(err){$('#authErr').textContent=err.message;btn.disabled=false}});
    return}
  document.querySelectorAll('.roles button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===role));
  renderTabs();
  const t=tab[role];
  $('#screenTitle').textContent=TITLES[t];
  v.innerHTML=t==='account'?account():role==='customer'?(t==='mine'?customerMine():customerPost()):(t==='find'?waiterFind():waiterShifts());
  if(t==='post'){['f-hours','f-rate'].forEach(id=>$('#'+id).addEventListener('input',updateQuote));updateQuote();
    $('#postForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
      try{await api('/lines',{method:'POST',body:{place:$('#f-place').value,what:$('#f-what').value,cat:$('#f-cat').value,startText:$('#f-start').value,hours:+$('#f-hours').value,rate:+$('#f-rate').value,notes:$('#f-notes').value}});
        tab.customer='mine';await load(true);window.scrollTo(0,0);toast('Line posted. Waiters can claim it now.')}
      catch(err){$('#formErr').textContent=err.message;btn.disabled=false}})}
  v.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});
}

// ---------- actions ----------
$('#view').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;b.disabled=true;
  try{
    if(a==='logout'){await api('/logout',{method:'POST'});me=null;data={mine:[],open:[],shifts:[]};lastJSON='';authMode='login';render();return}
    if(a==='outfit'){const input=id?document.getElementById('outfit-'+id):$('#acct-look');me=(await api('/me',{method:'PATCH',body:{look:input.value}})).user;toast(me.look?`Customers will look for: ${me.look}`:'Outfit cleared.');b.disabled=false;return}
    if(a==='cancel'){await api(`/lines/${id}/cancel`,{method:'POST'});toast('Request cancelled.')}
    if(a==='claim'){const r=await api(`/lines/${id}/claim`,{method:'POST'});toast(`Claimed. Head to ${r.line.place} by ${r.line.startText}.`);tab.waiter='shifts'}
    if(a==='advance'){const r=await api(`/lines/${id}/advance`,{method:'POST'});toast(`${r.line.ownerName} can see you're ${STAGES[idx(r.line.status)].short.toLowerCase()}.`)}
    if(a==='release'){await api(`/lines/${id}/release`,{method:'POST'});toast('Line released. Other waiters can claim it now.')}
    if(a==='position'){const r=await api(`/lines/${id}/position`,{method:'POST',body:{pos:+document.getElementById('pos-'+id).value}});toast(`Place in line updated to ${r.line.pos}.`)}
    if(a==='swap'){const r=await api(`/lines/${id}/swap`,{method:'POST',body:{code:document.getElementById('code-'+id).value}});toast(`Swap complete. You earned ${money(r.line.hours*r.line.rate)}.`)}
    await load(true);
  }catch(err){toast(err.message);b.disabled=false}
});

// ---------- data ----------
async function load(force){
  if(!me)return;
  const [mine,open,shifts]=await Promise.all(['mine','open','shifts'].map(s=>api('/lines?scope='+s).then(r=>r.lines)));
  const json=JSON.stringify([mine,open,shifts]);
  if(!force&&json===lastJSON)return;
  // Don't redraw while someone is typing in the page; the next check picks it up.
  const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!force&&typing)return;
  data={mine,open,shifts};lastJSON=json;render();
}
setInterval(()=>{if(me&&document.visibilityState==='visible')load(false).catch(()=>{})},5000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load(false).catch(()=>{})});

(async()=>{
  try{me=(await api('/me')).user}catch{me=null}
  if(me){try{await load(true)}catch(err){toast(err.message);render()}}else render();
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}
</script>
</body>
</html>
