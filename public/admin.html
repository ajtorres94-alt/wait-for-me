<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Wait For Me!</title>
<link rel="icon" type="image/png" href="/icons/icon-192-v2.png">
<style>
:root{--bg:#EEF0F6;--surface:#fff;--ink:#1A1F3D;--muted:#5D6485;--line:#D9DCE8;--logo:#FFCD44;--warn:#B45309;--warn-bg:#FDEBD3;--good:#1D8A55;--bad:#B42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10132A;--surface:#1A1F3D;--ink:#ECEEF8;--muted:#A3A9C9;--line:#2D3359;--logo:#FFD561;--warn:#F5A65B;--warn-bg:#3E2A14;--good:#5BD49A;--bad:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stub{background:var(--logo);color:#1A1F3D;font-weight:900;padding:3px 7px;border-radius:3px;transform:rotate(-4deg);font-size:12px}
h1{font-size:24px;margin:0}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.wrap{white-space:normal;min-width:200px}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--line)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer}
button.bad{border-color:var(--bad);color:var(--bad)}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#msg{min-height:22px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main>
  <div class="top"><span class="stub">No.1</span><h1>Wait For Me! admin</h1><a href="/dashboard" class="muted">Creator dashboard</a><button id="testMail" type="button">Send test email</button><a href="/" class="muted">Back to the app</a></div>
  <div id="msg" role="status"></div>
  <section class="card" id="usersCard"><h2>People</h2>
    <div class="row"><label class="sr" for="uq">Search people</label><input id="uq" placeholder="Search name or email"></div>
    <div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Posted</th><th>Worked</th><th>No-shows</th><th>Status</th><th></th></tr></thead><tbody id="users"></tbody></table></div>
  </section>
  <section class="card"><h2>Recent lines</h2>
    <div class="scroll"><table><thead><tr><th>#</th><th>Line</th><th>Starts</th><th>Booker</th><th>Waiter</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody id="lines"></tbody></table></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const day=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
let data={users:[],lines:[]},confirmKey=null;
function say(t){$('#msg').textContent=t}
async function call(path,method='GET'){
  const r=await fetch('/api/admin/'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Something went wrong.');return j}
function render(){
  const q=$('#uq').value.trim().toLowerCase();
  $('#users').innerHTML=data.users.filter(u=>!q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)).map(u=>`<tr>
    <td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${day(u.createdAt)}</td><td>${u.posted}</td><td>${u.worked}</td>
    <td>${u.noshows?`<span class="tag warn">${u.noshows}</span>`:'0'}</td><td>${u.suspended?'<span class="tag warn">Suspended</span>':'Active'}</td>
    <td class="row">${u.suspended?`<button data-u="${u.id}" data-a="unsuspend">Restore</button>`:`<button class="bad" data-u="${u.id}" data-a="suspend">${confirmKey==='suspend'+u.id?'Confirm suspend':'Suspend'}</button>`}
      <button data-u="${u.id}" data-a="reset-password">${confirmKey==='reset-password'+u.id?'Confirm reset':'Reset password'}</button></td></tr>`).join('');
  $('#lines').innerHTML=data.lines.map(l=>`<tr>
    <td>${l.id}</td><td class="wrap"><b>${esc(l.place)}</b><div class="muted">${esc(l.what)}</div></td><td>${esc(l.startText||'')}</td>
    <td>${esc(l.ownerName)}</td><td>${esc(l.waiterName||'—')}${l.checkinVerified===false?' <span class="tag warn">unverified check-in</span>':''}</td>
    <td>${esc(l.status)}${l.outcome?`<div class="muted">${esc(l.outcome.replace('_',' '))}</div>`:''}</td><td>${l.status==='done'?money(l.bill.total):''}</td>
    <td><button class="bad" data-l="${l.id}">${confirmKey==='line'+l.id?'Confirm remove':'Remove'}</button></td></tr>`).join('')}
async function load(){try{data=await call('overview');render();say('')}catch(e){say(e.message==='Not found.'?'Sign in to the app with an admin email first, then reload this page.':e.message)}}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  try{
    if(b.dataset.l){const k='line'+b.dataset.l;if(confirmKey!==k){confirmKey=k;render();return}
      await call(`lines/${b.dataset.l}/remove`,'POST');confirmKey=null;say(`Line #${b.dataset.l} removed.`)}
    if(b.dataset.u){const a=b.dataset.a,k=a+b.dataset.u;
      if(a!=='unsuspend'&&confirmKey!==k){confirmKey=k;render();return}
      const r=await call(`users/${b.dataset.u}/${a}`,'POST');confirmKey=null;
      say(a==='reset-password'?`Temporary password: ${r.tempPassword}  Give it to the person privately; they're signed out everywhere.`:a==='suspend'?'Account suspended and signed out.':'Account restored.')}
    await load2();
  }catch(err){say(err.message)}});
async function load2(){const m=$('#msg').textContent;await load();if(m)say(m)}
$('#uq').addEventListener('input',render);
$('#testMail').addEventListener('click',async e=>{e.stopPropagation();const b=e.currentTarget;b.disabled=true;say('Sending…');
  try{const r=await call('test-email','POST');say(`Test email sent to ${r.to}. Check that inbox (and spam).`)}catch(err){say(err.message)}b.disabled=false});
load();
</script>
</body>
</html>
