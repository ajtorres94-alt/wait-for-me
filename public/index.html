<html lang="en">
<head>

<meta name="theme-color" content="#1A1F3D">
<meta name="description" content="Book someone to wait in line and pick it up for you, or get paid to wait.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="/manifest.webmanifest">

<style>
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-size:14px}

<title>Wait For Me!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single phone-width app column; a role switch on top, a "take-a-number" ticket as the signature element */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --ink:#1A1F3D; --muted:#5D6485; --line:#D9DCE8;
  --ticket:#FFCD44; --logo:#FFCD44; --ticket-ink:#2A1E00; --primary:#1A1F3D; --on-primary:#FFFFFF;
  --good:#1D8A55; --good-bg:#DDF3E7; --warn:#B45309; --warn-bg:#FDEBD3; --info:#2F45D8; --info-bg:#E2E6FC;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10132A; --surface:#1A1F3D; --ink:#ECEEF8; --muted:#A3A9C9; --line:#2D3359;
  --ticket:#FFD561; --logo:#FFD561; --ticket-ink:#2A1E00; --primary:#FFD561; --on-primary:#1A1F3D;
  --good:#5BD49A; --good-bg:#16382A; --warn:#F5A65B; --warn-bg:#3E2A14; --info:#9DABFF; --info-bg:#252C5A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132A; --surface:#1A1F3D; --ink:#ECEEF8; --muted:#A3A9C9; --line:#2D3359;
  --ticket:#FFD561; --logo:#FFD561; --ticket-ink:#2A1E00; --primary:#FFD561; --on-primary:#1A1F3D;
  --good:#5BD49A; --good-bg:#16382A; --warn:#F5A65B; --warn-bg:#3E2A14; --info:#9DABFF; --info-bg:#252C5A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 20px}
.screen-title{font-family:var(--f-body);font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.1;padding-top:4px}
button,a,.card{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:no-preference){button:active{transform:scale(.97)}button{transition:transform .08s}}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.appbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo .stub{font-family:var(--f-display);background:var(--logo);color:var(--ticket-ink);padding:3px 6px;border-radius:3px;font-size:11px;transform:rotate(-4deg)}
.logo h1{font-family:var(--f-display);font-size:17px;font-weight:400;white-space:nowrap}
.sample{font-size:12px;color:var(--muted)}

.roles{display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:10px;padding:3px;gap:2px;flex:none}
.roles button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);min-height:32px}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .14)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-block:6px 4px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-height:50px;position:relative}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{stroke-width:2.3}
.tabbar button[aria-selected="true"] .ic{background:var(--ticket);color:var(--ticket-ink)}
.ic{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;position:relative}
.tabbar .plus .ic{background:var(--primary);color:var(--on-primary)}
.badge{position:absolute;top:-3px;right:6px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:10px;font-weight:800;display:grid;place-items:center;font-family:var(--f-mono)}

.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.row>div{min-width:0}
.card h3{font-size:17px;font-weight:700;line-height:1.3}
.meta{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.open{background:var(--info-bg);color:var(--info)}
.pill.active{background:var(--warn-bg);color:var(--warn)}
.pill.ready{background:var(--ticket);color:var(--ticket-ink)}
.pill.done{background:var(--good-bg);color:var(--good)}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.facts div{display:flex;flex-direction:column}
.facts span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}

/* signature: take-a-number ticket */
.ticket{--n:8px;background:var(--ticket);color:var(--ticket-ink);display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:6px;
  -webkit-mask:radial-gradient(circle var(--n) at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle var(--n) at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .num{font-family:var(--f-display);font-size:40px;line-height:1;min-width:2.2ch;text-align:center}
.ticket .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.75}
.ticket .txt{font-weight:600;font-size:14px;line-height:1.35}
.ticket .sep{width:0;align-self:stretch;border-left:2px dashed color-mix(in srgb,var(--ticket-ink) 35%,transparent)}

.steps{display:flex;gap:4px;list-style:none;padding:0;margin:0}
.steps li{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps li.on{background:var(--ticket)}
.stepnote{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stepnote b{color:var(--ink)}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

form.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field small{color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quote{background:var(--bg);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.quote div{display:flex;justify-content:space-between}
.quote .total{font-weight:800;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.earn{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;gap:10px;flex-wrap:wrap}
.earn b{font-family:var(--f-display);font-weight:400;font-size:28px}
.pos{display:flex;gap:6px;align-items:center}
.pos input{width:76px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:14px}
.who{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.who>div{min-width:0}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;border:3px solid var(--ticket)}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--good);background:var(--good-bg);padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:2px}
.look{font-size:13px;margin-top:2px}
.look b{font-weight:700}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codebox input{width:110px;letter-spacing:.3em;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:18px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.hint{font-size:12px;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv>div{min-width:0}
.kv small{display:block;color:var(--muted);font-size:12px}
.card-brand{font-family:var(--f-mono);font-weight:700}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:center;font-size:14px}
.checks li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;font-weight:800;font-size:12px}
.btn{min-height:44px;border-radius:12px}
.btn.small{min-height:36px;border-radius:10px}
.toast{z-index:7;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:420px){.two{grid-template-columns:1fr}.ticket .num{font-size:32px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card.flash{border-color:var(--ticket)}}
</style>
</head>
<body>

<style>
.auth{display:flex;flex-direction:column;gap:16px}
.auth .pitch{font-size:16px;color:var(--muted);max-width:40ch}
.auth .ticket{align-self:flex-start}
.switch{background:none;border:0;color:var(--info);font-weight:700;padding:6px 0;text-align:left}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wlabel{font-size:13px;font-weight:700}
.wheel-wrap{position:relative;height:180px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wheel-wrap:focus-within{outline:3px solid var(--info);outline-offset:2px}
.wheel-band{position:absolute;left:6px;right:6px;top:72px;height:36px;border-radius:8px;background:color-mix(in srgb,var(--ticket) 34%,transparent);border:1px solid color-mix(in srgb,var(--ticket) 70%,transparent)}
.wheel{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;padding-block:72px;outline:none;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel>div{height:36px;display:grid;place-items:center;scroll-snap-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;color:var(--muted);cursor:pointer;white-space:nowrap}
.wheel>div.on{color:var(--ink);font-weight:700;font-size:17px}
.tut{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.tut-in{max-width:520px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:18px}
.tut-top{display:flex;justify-content:space-between;align-items:center}
.tut-kicker{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tut-skip{background:none;border:0;color:var(--muted);font-weight:700;padding:8px 0;min-height:36px}
.tut-art{flex:1;min-height:230px;display:grid;place-items:center;border-radius:18px;padding:22px 16px;
  background:repeating-linear-gradient(-45deg,transparent 0 14px,color-mix(in srgb,var(--line) 45%,transparent) 14px 15px),var(--surface);border:1px solid var(--line)}
.tut-art>*{width:100%;max-width:340px;pointer-events:none}
.tut-art .card{box-shadow:0 10px 30px rgb(0 0 0 / .08)}
.tut h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tut p{margin:0;font-size:16px;line-height:1.5;color:var(--muted);max-width:44ch}
.tut-dots{display:flex;gap:6px}
.tut-dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.tut-dots i.on{width:22px;background:var(--ticket)}
.tut-nav{display:flex;gap:10px}
.tut-nav .btn{flex:1}
@media (prefers-reduced-motion:no-preference){.tut-step{animation:tutIn .28s ease-out}}
@keyframes tutIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.mini-btns{display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle input{width:48px;height:28px;accent-color:var(--ink)}
.meter{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.meter-top,.meter-bot{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.meter-top b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter-top span:last-child,.meter-bot b{margin-left:auto}
.meter-bot b{color:var(--ink);font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ticket);border-radius:4px;transition:width .4s}
.bar.warn i{background:var(--warn)}
.warnnote{font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px}
.receipt{display:grid;gap:4px;font-size:14px;background:var(--bg);border-radius:10px;padding:12px 14px}
.receipt div{display:flex;justify-content:space-between;gap:12px}
.receipt .total{font-weight:800;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.rate{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:32px;line-height:1;padding:2px 4px;color:var(--line);min-width:44px;min-height:44px}
.stars button.on{color:var(--ticket);text-shadow:0 0 1px var(--ticket-ink)}
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#1A1F3D;color:#FFFFFF;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.intro-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.intro-ticket{--n:14px;width:176px;height:112px;display:grid;place-items:center;background:#FFCD44;color:#1A1F3D;border-radius:10px;transform:rotate(-4deg);
  -webkit-mask:radial-gradient(circle var(--n) at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle var(--n) at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.intro-ticket span{font-family:var(--f-display);font-size:58px;line-height:1}
.intro-word{font-family:var(--f-display);font-size:30px;margin-top:10px}
.intro-tag{font-size:15px;color:#C9CEE6}
.intro-tap{margin-top:22px;border:2px solid #FFCD44;background:transparent;color:#FFCD44;font-weight:800;border-radius:99px;padding:10px 24px;min-height:44px;visibility:hidden}
.intro.needs-tap .intro-tap{visibility:visible}
.intro.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .intro-ticket{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
  .intro-word{animation:rise .5s .35s ease-out both}
  .intro-tag{animation:rise .5s .5s ease-out both}
  .intro.needs-tap .intro-tap{animation:rise .4s .3s ease-out both,pulse 1.6s 1s ease-in-out infinite}
  .intro{transition:opacity .35s ease}}
@keyframes pop{0%{transform:scale(.3) rotate(-14deg);opacity:0}70%{transform:scale(1.08) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.05)}}
.avatar.pic{background:none;border-color:var(--logo);padding:0;overflow:hidden}
.avatar.pic svg,.avpick svg{width:100%;height:100%;display:block}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.avpick{border:3px solid transparent;border-radius:50%;padding:0;background:none;aspect-ratio:1;max-width:100%;min-width:0}
.avpick[aria-pressed="true"]{border-color:var(--ink)}
.dist{font-size:13px;font-weight:700;color:var(--info);margin-top:2px}
.chip.near{font-weight:800}
.chip[disabled]{opacity:.6}
.links{display:flex;flex-direction:column;gap:2px}
.links a{color:var(--info);font-weight:600;padding:8px 0;text-decoration:none}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px 0;align-self:center;min-height:44px}
.card.danger{border-color:var(--warn)}
.btn.danger-btn{background:#B42318;color:#fff}
.hint a{color:var(--info)}
.offers{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.offer{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:10px}
.offer .who{background:none;padding:0}

.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
</style>

<script>
// Two kinds of request. Pickups: the waiter stands in line, buys the item, and hands it over.
// Saved spots: the waiter saves a spot where that's normal (a parade curb, a lawn) and hands it over.
const STAGE_TXT={
 pickup:{open:['Waiting for a waiter','Posted'],claimed:['Waiter booked','Booked'],enroute:['Waiter on the way','On the way'],inline:['In line at the store','In line'],
   nearfront:['Almost at the register','Near register'],handoff:['Bought it, ready to hand over','Bought'],done:['Done','Done']},
 spot:{open:['Waiting for a waiter','Posted'],claimed:['Waiter booked','Booked'],enroute:['Waiter on the way','On the way'],inline:['Saving your spot','Saving spot'],
   nearfront:['Saving your spot','Saving spot'],handoff:['Ready to hand over','Ready'],done:['Done','Done']}};
const KEYS={pickup:['open','claimed','enroute','inline','nearfront','handoff','done'],spot:['open','claimed','enroute','inline','done'],
  legacy:['open','claimed','enroute','inline','nearfront','handoff','done']};
const kindOf=j=>j&&j.kind==='pickup'?'pickup':'spot';
const keysFor=j=>kindOf(j)==='pickup'?KEYS.pickup:['nearfront','handoff'].includes(j.status)?KEYS.legacy:KEYS.spot;
const stLabel=j=>STAGE_TXT[kindOf(j)][j.status][0], stShort=j=>STAGE_TXT[kindOf(j)][j.status][1];
const FEE=0.15,BOOKING_FEE=2.5,ITEM_FEE=0.03,MAX_ITEM=150;
const r2=n=>Math.round(n*100)/100;
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000)}
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};

let delOpen=false,offerOpen=null;const offerDraft={};
let me=null, role=store.get('wfm_role')==='waiter'?'waiter':'customer', tab={customer:'mine',waiter:'find'}, filter='All', authMode='signup';
let data={mine:[],open:[],shifts:[]}, lastJSON='', lastData=null;

async function api(path,{method='GET',body}={}){
  let r;
  try{r=await fetch('/api'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'})}
  catch{throw new Error('You seem to be offline. Check your connection and try again.')}
  let j={};try{j=await r.json()}catch{}
  if(r.status===401&&path!=='/login'){me=null;render()}
  if(!r.ok){const e=new Error(j.error||'Something went wrong. Try again.');e.code=j.code;throw e}
  return j;
}

// ---------- shared bits ----------
function pillFor(j){
  const s=j.status;
  if(s==='open')return'<span class="pill open">Open</span>';
  if(s==='handoff')return`<span class="pill ready">${stShort(j)}</span>`;
  if(s==='done')return'<span class="pill done">Done</span>';
  return`<span class="pill active">${stShort(j)}</span>`}
// Accepts a line, or {kind, status} for the walkthrough pictures.
function steps(j){const keys=keysFor(j),i=keys.indexOf(j.status);return`<ol class="steps" aria-label="Progress: ${stLabel(j)}">${keys.slice(1).map((k,n)=>`<li class="${n+1<=i?'on':''}" title="${STAGE_TXT[kindOf(j)][k][1]}"></li>`).join('')}</ol>`}
const kindTag=j=>`<span class="kindtag ${kindOf(j)}">${kindOf(j)==='pickup'?'Pick it up':'Save my spot'}</span>`;
// The most a job could cost the booker (time at the approved hours, fees, and for pickups the item limit and drop-off fee).
function upTo(j,hours){const h=hours??(j.bill?j.bill.approvedHours:j.hours),time=h*j.rate;
  let t=time*(1+FEE)+BOOKING_FEE;if(kindOf(j)==='pickup'){t+=(+j.itemBudget||0)*(1+ITEM_FEE);if(j.handoff==='dropoff')t+=+j.dropoffFee||0}return t}
const waiterUpTo=j=>(j.bill?j.bill.approvedHours:j.hours)*j.rate+(kindOf(j)==='pickup'&&j.handoff==='dropoff'?+j.dropoffFee||0:0);
function facts(j,mode){
  const b=billOf(j),done=j.status==='done';
  const third=mode==='customer'?(done?['Paid',money(b.total)]:['Up to',money(upTo(j))]):(done?['Earned',money(b.pay)]:['Up to',money(waiterUpTo(j))]);
  return`<div class="facts"><div><span>Starts</span><b>${esc(j.startText)}</b></div><div><span>${done?'Billed':'Approved'}</span><b>${fmtShort(done?b.billed:b.approved)}</b></div><div><span>${third[0]}</span><b>${third[1]}</b></div></div>`}
// What to buy, for pickups.
function itemBox(j,mode){
  if(kindOf(j)!=='pickup')return'';
  const bought=!!j.purchasedAt&&j.outcome!=='sold_out';
  const rows=[`<div><span>Buy</span><b>${esc(j.item||j.what)}</b></div>`];
  if(j.itemDetails)rows.push(`<div><span>Details</span><span>${esc(j.itemDetails)}</span></div>`);
  if(j.itemBackup)rows.push(`<div><span>If sold out</span><span>${esc(j.itemBackup)}</span></div>`);
  rows.push(bought?`<div><span>Bought for</span><b class="mono">${money(j.itemTotal)}</b></div>`:`<div><span>Item limit</span><b class="mono">${money(j.itemBudget)}</b></div>`);
  rows.push(`<div><span>Handover</span><span>${j.handoff==='dropoff'?`Drop-off (+${money(j.dropoffFee)} to the waiter)`:'Meet up'}</span></div>`);
  if(j.handoff==='dropoff'&&j.dropoffAddr&&(mode==='waiter'||mode==='customer'))rows.push(`<div><span>Drop off at</span><span>${esc(j.dropoffAddr)}</span></div>`);
  if(bought&&j.itemNote)rows.push(`<div><span>Note</span><span>${esc(j.itemNote)}</span></div>`);
  return`<div class="itembox">${rows.join('')}${bought&&j.hasReceipt?`<a class="rcpt" href="/api/lines/${j.id}/receipt" target="_blank" rel="noopener">View receipt photo</a>`:''}</div>`}
const SPOT_RULE='Save my spot isn\'t for cutting in line. Use it only where saving a spot is normal and allowed, like a parade route, a fireworks show, an outdoor movie lawn, a beach or park picnic area, or a campout before an event. You can\'t take over a place in a line ahead of people who are waiting. Wait For Me! does not condone or endorse line-cutting, and we remove requests that break this rule.';
const SPOT_RULE_SHORT='Saving a spot only, not a place in a line. Wait For Me! does not condone or endorse line-cutting.';
// Mirrors the server's billing so the clock and cost tick between refreshes.
let clockSkew=0;
const nowS=()=>Date.now()+clockSkew;
function billOf(j){
  if(j.status==='done'&&j.bill){const s=j.bill;return{approved:s.approvedHours,waited:s.waitedHours,billed:s.billedHours,time:s.timePay??s.waiterPay,drop:s.dropoff||0,item:s.item||0,
    pay:s.waiterPay,svc:s.serviceFee??s.fee,book:s.bookingFee||0,ifee:s.itemFee||0,fee:s.fee,payout:s.payout??s.waiterPay,total:s.total,timeUp:s.timeUp,nearUp:false}}
  const approved=j.bill?j.bill.approvedHours:j.hours,ci=j.checkinAt?Date.parse(j.checkinAt):null;
  const bought=kindOf(j)==='pickup'&&!!j.purchasedAt,end=bought?Date.parse(j.purchasedAt):nowS();
  const w=ci?Math.max(0,(end-ci)/3600e3):0;
  let billed=Math.min(approved,Math.max(1,Math.ceil(w*4-1e-9)/4));if(!ci)billed=0;
  const time=r2(billed*j.rate),item=bought?+j.itemTotal||0:0,drop=bought&&j.handoff==='dropoff'?+j.dropoffFee||0:0;
  const pay=r2(time+drop),svc=r2(time*FEE),book=billed>0?BOOKING_FEE:0,ifee=r2(item*ITEM_FEE),fee=r2(svc+book+ifee);
  const live=!!ci&&!bought;
  return{approved,waited:w,billed,time,drop,item,pay,svc,book,ifee,fee,payout:r2(pay+item),total:r2(pay+item+fee),timeUp:live&&w>=approved,nearUp:live&&w>=approved-0.25}}
// The itemized bill shown on finished jobs (and once a pickup is bought).
function billRows(b,who){
  const rows=[['Time in line',clockTxt(b.waited)],['Billed',fmtShort(b.billed)],[who==='customer'?'Waiter time':'Your time',money(b.time)]];
  if(b.drop)rows.push(['Drop-off',money(b.drop)]);
  if(b.item)rows.push([who==='customer'?'Item (receipt price)':'Item paid back',money(b.item)]);
  if(who==='customer'){rows.push(['Service fee (15% of time)',money(b.svc)]);if(b.book)rows.push(['Booking fee',money(b.book)]);if(b.ifee)rows.push(['Card processing (3% of item)',money(b.ifee)])}
  return`<div class="receipt">${rows.map(([k,v])=>`<div><span>${k}</span><span class="mono">${v}</span></div>`).join('')}<div class="total"><span>${who==='customer'?'Total':'You receive'}</span><span class="mono">${money(who==='customer'?b.total:b.payout)}</span></div></div>`}
const clockTxt=h=>{const m=Math.floor(h*60);return`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`};
function meterInner(j,mode){
  const b=billOf(j),pct=Math.min(100,b.waited/b.approved*100);
  return`<div class="meter-top"><span>${kindOf(j)==='pickup'?'Time in line':'Time at the spot'}</span><b class="mono">${clockTxt(b.waited)}</b><span>of ${fmtShort(b.approved)} approved</span></div>
   <div class="bar${b.nearUp?' warn':''}"><i style="width:${pct}%"></i></div>
   <div class="meter-bot"><span>${mode==='customer'?'Cost so far (1 hr minimum)':'Earned so far (1 hr minimum)'}</span><b class="mono">${money(mode==='customer'?b.total:b.pay)}</b></div>`}
const meterHTML=(j,mode)=>j.checkinAt&&j.status!=='done'&&!(kindOf(j)==='pickup'&&j.purchasedAt)?`<div class="meter" data-timer="${j.id}" data-mode="${mode}">${meterInner(j,mode)}</div>`:'';
setInterval(()=>document.querySelectorAll('[data-timer]').forEach(el=>{const id=+el.dataset.timer,j=[...data.mine,...data.shifts].find(x=>x.id===id);if(j)el.innerHTML=meterInner(j,el.dataset.mode)}),10000);
let myRatings=null,TAGS={waiter:[],booker:[]};
// ---------- payments (Stripe) ----------
let PAY={enabled:false},cardOpen=false,cardUI=null,stripeP=null;
function loadStripe(){if(!stripeP)stripeP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://js.stripe.com/v3/';
  s.onload=()=>res(window.Stripe(PAY.publishableKey));s.onerror=()=>{stripeP=null;rej(new Error("The card form couldn't load. Check your connection and try again."))};document.head.appendChild(s)});return stripeP}
async function mountCard(){const host=$('#card-el');if(!host||host.dataset.mounted)return;host.dataset.mounted='1';
  host.closest('.card').scrollIntoView({block:'start',behavior:'smooth'});
  try{const stripe=await loadStripe();const {clientSecret}=await api('/payments/card/start',{method:'POST'});
    const dark=matchMedia('(prefers-color-scheme: dark)').matches;
    const elements=stripe.elements({clientSecret,appearance:{theme:dark?'night':'stripe',variables:{colorPrimary:dark?'#FFD561':'#1A1F3D',borderRadius:'10px',fontFamily:'system-ui, -apple-system, Segoe UI, sans-serif'}}});
    const pe=elements.create('payment',{layout:'tabs'});pe.mount(host);cardUI={stripe,elements};const s=$('#card-save');if(s)s.disabled=false}
  catch(e){const x=$('#cardErr');if(x)x.textContent=e.message}}
async function finishCard(id){const r=await api('/payments/card/finish',{method:'POST',body:{setupIntentId:id}});me=r.user;cardOpen=false;cardUI=null;toast(`Saved ${r.card}. You can post requests now.`)}
function goAccount(msg,openCard){tab[role]='account';if(openCard)cardOpen=true;render();window.scrollTo(0,0);if(msg)toast(msg)}
function payNeedsSetup(err){if(err&&err.code==='card_required'){goAccount('Add a card to post requests.',true);return true}
  if(err&&err.code==='payouts_required'){goAccount('Set up payouts so we can pay you, then claim the job.');return true}return false}
function paymentCard(){
  if(!PAY.enabled)return`<article class="card section"><h2>Payments</h2>
    <div class="note">Card payments and waiter payouts aren't switched on yet. For now, settle up directly with each other using the totals shown on each finished line.</div></article>`;
  const po=me.payouts;
  return`<article class="card section"><h2>Paying for lines</h2>
    <div class="kv"><div>Card for bookings<small>Charged after each job for your waiter's time, plus the receipt price for pickups.</small></div><b>${me.card?esc(me.card):'None'}</b></div>
    ${cardOpen?`<div class="cardbox"><div id="card-el" class="card-el"></div>
      ${PAY.testMode?'<div class="hint">Test mode: use card 4242 4242 4242 4242, any future date, any 3-digit CVC and any ZIP. No real money moves.</div>':''}
      <span class="meta" id="cardErr" role="alert"></span>
      <div class="btns"><button class="btn small" id="card-save" data-act="card-save" disabled>Save card</button><button class="btn ghost small" data-act="card-close">Cancel</button></div></div>`
    :`<div class="btns"><button class="btn ${me.card?'ghost ':''}small" data-act="card-open">${me.card?'Change card':'Add a card'}</button></div>`}</article>
  <article class="card section"><h2>Getting paid</h2>
    <div class="kv"><div>Payouts for waiting<small>Stripe sends your earnings to your bank. You'll verify your identity with Stripe once.</small></div><b>${po==='ready'?'On':po==='started'?'Pending':'Off'}</b></div>
    <div class="btns">${po==='ready'?'<button class="btn ghost small" data-act="payouts">See payouts and earnings</button>'
      :`<button class="btn small" data-act="payouts">${po==='started'?'Finish payout setup':'Set up payouts'}</button>${po==='started'?'<button class="btn ghost small" data-act="payouts-check">Check status</button>':''}`}</div>
    ${PAY.testMode&&po!=='ready'?'<div class="hint">Test mode: on Stripe\'s page, use test phone 000 000 0000, code 000000, SSN 000-00-0000 and their test bank account. No real money moves.</div>':''}</article>`}
function payNote(j,who){
  if(!PAY.enabled||!j.waiterId)return'';const st=j.payStatus;
  if(who==='customer'){
    if(j.status==='done'){if(st==='captured')return`<div class="hint">Charged ${money(j.payCaptured/100)} to ${esc(me.card||'your card')}.</div>`;
      if(st==='released')return`<div class="hint">No charge. The hold on your card was released.</div>`;
      if(st==='charge_failed')return`<div class="warnnote">The charge didn't go through${j.payError?`: ${esc(j.payError)}`:''}. Update your card in Account and we'll try again.</div><div class="btns"><button class="btn small" data-act="card-acct">Update card</button></div>`;return''}
    if(st==='held')return`<div class="hint">A hold of up to ${money(j.payHeld/100)} is on your card. You're only charged for the actual time${kindOf(j)==='pickup'?' and the receipt price':''}.</div>`;
    if(st==='failed')return`<div class="warnnote">We couldn't place a hold on your card${j.payError?`: ${esc(j.payError)}`:''}. Update your card so your waiter knows they'll be paid.</div><div class="btns"><button class="btn small" data-act="card-acct">Update card</button></div>`;
    return`<div class="hint">We'll place a hold on your card a few days before the start time.</div>`}
  if(j.status==='done'){if(st==='captured')return`<div class="hint">Paid. Stripe sends it to your bank on your payout schedule.</div>`;
    if(st==='charge_failed')return`<div class="warnnote">We're still collecting this payment from the booker. You'll be paid as soon as it goes through.</div>`;return''}
  if(st==='held')return`<div class="hint">✓ Payment secured.</div>`;
  if(st==='failed')return`<div class="warnnote">Payment isn't secured yet. We've asked ${esc(j.ownerName||'the booker')} to update their card. You can release this line with no penalty before you check in.</div>`;
  return`<div class="hint">We'll secure payment from the booker a few days before the start time.</div>`}
const ratingTxt=r=>r&&r.avg!=null?`★ ${r.avg.toFixed(1)} · ${r.count} ratings`:'New · fewer than 3 ratings';
const rateDraft={};
function rateHTML(j,name,kind){
  if(j.myRating)return`<div class="meta">You rated ${esc(name)} ${'★'.repeat(j.myRating)}${'☆'.repeat(5-j.myRating)}. It shows on their profile 3 days after the job.</div>`;
  if(!j.canRate)return'';
  const d=rateDraft[j.id]||{stars:0,tags:[]};
  return`<div class="rate"><b>Rate ${esc(name)}</b>

   <div class="filters">${(TAGS[kind]||[]).map(t=>`<button type="button" class="chip" aria-pressed="${d.tags.includes(t)}" data-tag="${esc(t)}" data-id="${j.id}">${esc(t)}</button>`).join('')}</div>

const fmtStart=d=>d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const localInput=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)};
const clockOf=ms=>new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

   <circle cx="32" cy="27" r="13" fill="${A.skin}"/><circle cx="27.5" cy="27" r="1.6" fill="${AV_INK}"/><circle cx="36.5" cy="27" r="1.6" fill="${AV_INK}"/>${smile}${front}</svg>`}

let cancelOpen=null;
function customerMine(){
  const mine=data.mine.slice().sort((a,b)=>(a.status==='done')-(b.status==='done'));
  if(!mine.length)return`<div class="empty">Nothing posted yet. Tap <b>Post</b> to have someone pick something up for you or save your spot.</div>`;
  return`<div class="list">${mine.map(j=>{
    const b=billOf(j),pickup=kindOf(j)==='pickup',bought=pickup&&!!j.purchasedAt,active=j.waiterId&&j.status!=='done';let ticket='',actions='',extra='';
    const W=esc(j.waiterName);
    if(pickup&&(j.status==='inline'||j.status==='nearfront'))ticket=`<div class="ticket"><div><div class="lbl">Place</div><div class="num">${j.pos??'—'}</div></div><div class="sep"></div><div class="txt">${W} is in line for your ${esc(j.item||j.what)}. ${j.status==='nearfront'?'They\'re almost at the register.':'You\'ll see the receipt here when they buy it.'}</div></div>`;
    if(!pickup&&['inline','nearfront','handoff'].includes(j.status))ticket=`<div class="ticket"><div><div class="lbl">Spot code</div><div class="num">${esc(j.code)}</div></div><div class="sep"></div><div class="txt">${W} is saving your spot. When you get there, find them and read out this code. They enter it to hand the spot over.</div></div>`;
    else if(pickup&&j.status==='handoff')ticket=`<div class="ticket"><div><div class="lbl">Handoff code</div><div class="num">${esc(j.code)}</div></div><div class="sep"></div><div class="txt">${W} bought your item${j.handoff==='dropoff'?' and is bringing it to you':''}. When you meet, read out this code. They enter it to hand it over.</div></div>`;
    else if(active)ticket+=`<div class="hint">Your ${pickup?'handoff':'spot'} code is <b class="mono">${esc(j.code)}</b>. Only share it in person.</div>`;
    if(active&&j.codeResetAt&&nowS()-Date.parse(j.codeResetAt)<2*3600e3)extra+=`<div class="warnnote">Someone entered the wrong code 5 times, so we made a new one. Only give your code to your waiter in person.</div>`;
    if(active&&!j.checkinAt)extra+=`<div class="hint">The clock starts when ${W} checks in${pickup?' at the store':' at the spot'}. You only pay for time they actually spend${pickup?' in line':' there'}.</div>`;
    if(active&&j.noShowAt&&nowS()>=j.noShowAt)extra+=`<div class="warnnote">${W} hasn't checked in and it's past the start time. You can report a no-show and your request reopens for other waiters, at no charge.</div>`;
    if(active&&b.nearUp)extra+=`<div class="warnnote">${b.timeUp?'Your approved time is up.':'Your approved time is almost up.'} Add time, or ${W} can end the shift when it runs out.</div>`;
    if(active&&bought&&j.graceEndsAt)extra+=nowS()>=j.graceEndsAt?`<div class="warnnote">It's been 2 hours since ${W} bought your item. They can close the job now, and you'd still be charged in full. Message them to meet up.</div>`
      :`<div class="hint">Meet ${W} by ${clockOf(j.graceEndsAt)}. After that they can close the job, and you'd still be charged in full and need to arrange pickup in Messages.</div>`;
    if(bought&&active)extra+=billRows(b,'customer');
    if(j.status==='open'){
      actions=j.expired?`<button class="btn small" data-act="edit" data-id="${j.id}">Change the time</button><button class="btn ghost small" data-act="cancel" data-id="${j.id}">Remove</button>`
        :`<button class="btn ghost small" data-act="edit" data-id="${j.id}">Edit</button><button class="btn ghost small" data-act="cancel" data-id="${j.id}">Cancel request</button>`;
      if(j.expired)extra=`<div class="warnnote">The start time has passed, so waiters can't see this anymore. Change the time to repost it, or remove it.</div>`;
      else if(j.offers&&j.offers.length)extra=`<div class="offers"><b>${j.offers.length===1?'1 waiter offered':j.offers.length+' waiters offered'} a different rate</b>${j.offers.map(o=>`
        <div class="offer">${whoCard(o.waiterName,ratingTxt(o.waiterRating),undefined,o.waiterAvatar)}
          <div class="offer-row"><span><b class="mono">${fmtRate(o.rate)}/hr</b><span class="meta"> · up to ${money(upTo({...j,rate:o.rate}))}</span></span>
          <span class="btns"><button class="btn small" data-act="accept-offer" data-id="${j.id}" data-offer="${o.id}">Accept</button><button class="btn ghost small" data-act="decline-offer" data-id="${j.id}" data-offer="${o.id}">Decline</button></span></div></div>`).join('')}
        <div class="hint">Accepting books that waiter at their rate. You listed ${fmtRate(j.rate)}/hr. Offers expire after 12 hours.</div></div>`;
    }
    if(active){
      actions=bought?'':`<button class="btn ${b.nearUp?'':'ghost '}small" data-act="extend" data-id="${j.id}">Add 30 min (up to +${money(0.5*j.rate*(1+FEE))})</button>`;
      if(j.noShowAt&&nowS()>=j.noShowAt)actions=`<button class="btn small" data-act="noshow" data-id="${j.id}">Report no-show</button>`+actions;
      if(!bought)actions+=`<button class="btn ghost small" data-act="cancelbk-open" data-id="${j.id}">Cancel booking</button>`;
      if(cancelOpen===j.id&&!bought){
        const cost=j.cancelAs==='cancelled_free'?'It\'s free, because it\'s more than 2 hours before the start time.'
          :j.cancelAs==='cancelled_late'?`You'll pay 1 hour of waiter pay (${money(j.rate)}), with no fees, because it's within 2 hours of the start or your waiter is on the way.`
          :`You'll pay for the time ${W} has waited (1 hour minimum) plus fees: about ${money(b.total)} right now.`;
        extra+=`<div class="confirm"><b>Cancel this booking?</b><div class="meta">${cost}</div><div class="btns"><button class="btn danger-btn small" data-act="cancelbk" data-id="${j.id}">Cancel booking</button><button class="btn ghost small" data-act="cancelbk-close" data-id="${j.id}">Keep it</button></div></div>`}
    }
    if(j.status==='done'){
      const txt=OUTCOME_TXT.customer[j.outcome];
      extra=`${billRows(b,'customer')}${txt?`<div class="hint">${txt(W)}</div>`:''}${rateHTML(j,j.waiterName,'waiter')}`}
    const pill=j.status==='open'&&j.expired?'<span class="pill expired">Expired</span>':j.status==='done'&&/^cancelled/.test(j.outcome||'')?'<span class="pill expired">Cancelled</span>':pillFor(j);
    return`<article class="card"><div class="row"><div>${kindTag(j)}<h3>${esc(j.place)}</h3>${pickup?'':`<div class="meta">${esc(j.what)}</div>`}</div>${pill}</div>
      ${j.status!=='open'?steps(j):''}
      <div class="stepnote"><span><b>${j.status==='open'&&j.expired?'Start time passed':stLabel(j)}</b></span><span>${j.waiterId?'Your waiter':j.expired?'Hidden from waiters':'Visible to waiters now'}</span></div>
      ${itemBox(j,'customer')}
      ${active?whoCard(j.waiterName,'Your waiter · '+ratingTxt(j.waiterRating),j.waiterLook||'',j.waiterAvatar):''}${ticket}${checkinNote(j)}${meterHTML(j,'customer')}${extra}${payNote(j,'customer')}${facts(j,'customer')}${actions?`<div class="btns">${actions}</div>`:''}${active||j.chatOpen?chatHTML(j,j.waiterName):''}</article>`}).join('')}</div>`}

     <div class="two grp" data-for="dropoff"${postHandoff==='dropoff'?'':' hidden'}>
       <div class="field"><label for="f-dropfee">Drop-off fee</label><input id="f-dropfee" type="number" inputmode="numeric" min="5" max="50" step="1" value="${v('dropoffFee',10)||10}"><small>All of it goes to your waiter. $5 to $50.</small></div>
       <div class="field"><label for="f-dropaddr">Drop-off address</label><input id="f-dropaddr" maxlength="200" autocomplete="street-address" placeholder="Street, city" value="${v('dropoffAddr')}"><small>Only your waiter sees it.</small></div></div>
   </div>

   </div>
   <div class="two"><div class="field"><label for="f-cat">Type</label><select id="f-cat">${cats.map(c=>`<option${(e?e.cat:'Food')===c?' selected':''}>${c}</option>`).join('')}</select></div>
   <div class="field"><label for="f-when">When should they arrive?</label><input id="f-when" type="datetime-local" min="${minD}" value="${start&&start>new Date()?localInput(start):''}"></div></div>
   <div class="wheels">${wheelHTML('hours','Estimated wait',HOURS,fmtHours,wheel.hours)}${wheelHTML('rate','Hourly rate',RATES,fmtRate,wheel.rate)}</div>
   <div class="field"><label for="f-notes">Notes for your waiter</label><textarea id="f-notes" rows="2" maxlength="500" placeholder="${pk?'Where to meet, how to reach you':'When you\'ll arrive, how to reach you, what to bring'}">${esc(e?e.notes||'':'')}</textarea><small>Only the waiter who takes your request sees your notes and name.</small></div>
   <div class="quote" id="quote"></div>
   <button class="btn block" type="submit">${e?'Save changes':'Post request'}</button>${e?`<button class="btn ghost block" type="button" data-act="edit-cancel">Cancel editing</button>`:''}<span class="meta" id="formErr" role="alert"></span></form>`}
// Switch the post form between the two kinds without losing what's been typed.
function setPostKind(k){postKind=k;const f=$('#postForm');if(!f)return;
  f.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-checked',b.dataset.kind===k));
  f.querySelectorAll('.grp[data-for="pickup"]').forEach(g=>g.hidden=k!=='pickup');f.querySelectorAll('.grp[data-for="spot"]').forEach(g=>g.hidden=k!=='spot');
  $('#l-place').textContent=k==='pickup'?'Where should they buy it?':'Where is the spot?';
  $('#f-place').placeholder=k==='pickup'?'e.g. Porto\'s Bakery, Buena Park':'e.g. Rose Parade route, Pasadena';
  $('#f-notes').placeholder=k==='pickup'?'Where to meet, how to reach you':'When you\'ll arrive, how to reach you, what to bring';

function setHandoff(h){postHandoff=h;const f=$('#postForm');f.querySelectorAll('[data-hand]').forEach(b=>b.setAttribute('aria-checked',b.dataset.hand===h));
  f.querySelector('.grp[data-for="dropoff"]').hidden=h!=='dropoff';updateQuote()}
// ---------- scroll wheels ----------
const HOURS=Array.from({length:96},(_,i)=>(i+1)/4);   // 15 min … 24 hr
const RATES=Array.from({length:781},(_,i)=>5+i/4);    // $5.00 … $200.00
const WHEELS={hours:{items:HOURS,fmt:v=>fmtHours(v)},rate:{items:RATES,fmt:v=>fmtRate(v)}};
const ROW=36;
let wheel={hours:7,rate:60};                           // 2 hr, $20.00
function fmtHours(h){const hh=Math.floor(h),m=Math.round((h-hh)*60);return hh&&m?`${hh} hr ${m} min`:hh?`${hh} hr`:`${m} min`}
function fmtShort(h){const hh=Math.floor(h),m=Math.round((h-hh)*60);return hh&&m?`${hh}h ${m}m`:hh?`${hh} hr`:`${m} min`}
function fmtRate(r){return'$'+r.toFixed(2)}
function wheelHTML(key,label,items,fmt,i){
  return`<div class="field"><span class="wlabel" id="wl-${key}">${label}</span><div class="wheel-wrap"><div class="wheel-band" aria-hidden="true"></div>
   <div class="wheel" id="w-${key}" tabindex="0" role="spinbutton" aria-labelledby="wl-${key}" aria-valuemin="0" aria-valuemax="${items.length-1}" aria-valuenow="${i}" aria-valuetext="${fmt(items[i])}">${items.map((v,k)=>`<div data-i="${k}"${k===i?' class="on"':''}>${fmt(v)}</div>`).join('')}</div></div></div>`}
function initWheel(key){
  const el=$('#w-'+key),{items,fmt}=WHEELS[key],smooth=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
  el.scrollTop=wheel[key]*ROW;
  let raf=0;
  const set=i=>{i=Math.max(0,Math.min(items.length-1,i));if(i===wheel[key])return;
    el.children[wheel[key]]?.classList.remove('on');el.children[i].classList.add('on');wheel[key]=i;
    el.setAttribute('aria-valuenow',i);el.setAttribute('aria-valuetext',fmt(items[i]));
    try{navigator.vibrate&&navigator.vibrate(4)}catch{}
    updateQuote()};
  const go=i=>{i=Math.max(0,Math.min(items.length-1,i));el.scrollTo({top:i*ROW,behavior:smooth})};
  el.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>set(Math.round(el.scrollTop/ROW)))},{passive:true});
  el.addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d)go(+d.dataset.i)});
  el.addEventListener('keydown',e=>{const step={ArrowUp:-1,ArrowDown:1,PageUp:-4,PageDown:4}[e.key];
    if(step){e.preventDefault();go(wheel[key]+step)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(items.length-1)}});
}
function updateQuote(){
  const q=$('#quote');if(!q)return;
  const h=HOURS[wheel.hours],r=RATES[wheel.rate],time=h*r,svc=time*FEE,pk=postKind==='pickup';
  const budget=pk?Math.min(MAX_ITEM,Math.max(0,parseFloat($('#f-budget').value)||0)):0,drop=pk&&postHandoff==='dropoff'?Math.max(0,parseFloat($('#f-dropfee').value)||0):0;
  const ifee=budget*ITEM_FEE,total=time+svc+BOOKING_FEE+budget+drop+ifee;
  const row=(k,v)=>`<div><span>${k}</span><span class="mono">${v}</span></div>`;
  q.innerHTML=row(`Waiter time (${fmtHours(h)} × ${fmtRate(r)}/hr)`,money(time))
    +(pk?row('Item, up to',budget?money(budget):'—'):'')+(drop?row('Drop-off',money(drop)):'')
    +row('Service fee (15% of time)',money(svc))+row('Booking fee',money(BOOKING_FEE))+(pk&&budget?row('Card processing (3% of item)',money(ifee)):'')
    +`<div class="total"><span>${pk?'Most you\'ll pay':'Estimated total'}</span><span class="mono">${money(total)}</span></div>`
    +`<div class="hint" style="display:block">${pk?'You pay the receipt price for the item and only for the time your waiter spends in line (1 hour minimum).':'You only pay for the time your waiter spends saving your spot (1 hour minimum).'}</div>`}

// ---------- Near me (waiters) ----------
let near={on:false,pos:null,radius:0,busy:false};
function miles(a,b){const R=3958.8,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const distOf=j=>near.pos&&j.lat!=null?miles(near.pos,{lat:j.lat,lng:j.lng}):null;
function distTxt(j){const d=distOf(j);if(d==null)return near.on?'Distance unknown':'';const n=d<10?d.toFixed(1):Math.round(d);return`${j.geoApprox?'About ':''}${n} mi away`}
function locate(){
  if(!navigator.geolocation){toast('This phone can\'t share its location with the app.');return}
  near.busy=true;render();
  navigator.geolocation.getCurrentPosition(p=>{near={on:true,pos:{lat:p.coords.latitude,lng:p.coords.longitude},radius:near.radius,busy:false};render()},
    e=>{near.busy=false;near.on=false;render();toast(e.code===1?'Location is blocked. Allow location for this app in your phone\'s settings, then try again.':'Couldn\'t get your location. Try again in a moment.')},
    {enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}
function waiterFind(){
  const cats=['All','Food','Releases','Errands','Events'];
  let open=data.open.filter(j=>filter==='All'||j.cat===filter);
  if(near.on){
    if(near.radius)open=open.filter(j=>{const d=distOf(j);return d!=null&&d<=near.radius});
    open=open.slice().sort((a,b)=>{const x=distOf(a),y=distOf(b);return(x==null)-(y==null)||(x??0)-(y??0)});
  }
  const radii=[[0,'Any distance'],[5,'5 mi'],[10,'10 mi'],[25,'25 mi']];
  return`<div class="list"><div class="filters" role="group" aria-label="Filter by type">${cats.map(c=>`<button class="chip" aria-pressed="${filter===c}" data-cat="${c}">${c}</button>`).join('')}</div>
   <div class="filters" role="group" aria-label="Distance">
     <button class="chip near" aria-pressed="${near.on}" data-near="toggle"${near.busy?' disabled':''}>${near.busy?'Finding you…':near.on?'◉ Near me':'◎ Near me'}</button>
     ${near.on?radii.map(([r,l])=>`<button class="chip" aria-pressed="${near.radius===r}" data-radius="${r}">${l}</button>`).join(''):''}</div>
   ${open.length?open.map(j=>{const pickup=kindOf(j)==='pickup';return`<article class="card"><div class="row"><div>${kindTag(j)}<h3>${esc(j.place)}</h3><div class="meta">${pickup?'':esc(j.what)+' · '}Booker: ${ratingTxt(j.ownerRating)}</div>${near.on?`<div class="dist">${distTxt(j)}</div>`:''}</div><span class="pill open">${fmtRate(j.rate)}/hr</span></div>
     ${itemBox(j,'browse')}
     ${facts(j,'waiter')}
     <div class="hint">${pickup?`Paid for your time from check-in to purchase, 1 hour minimum. You pay for the item (up to ${money(j.itemBudget)}) and get it back with your pay.`:`${SPOT_RULE_SHORT} Paid for your time from check-in to handover, 1 hour minimum.`} You'll see the booker's name and notes after you claim.</div>
     ${j.myOffer?`<div class="offer-row"><span class="meta">You offered <b class="mono">${fmtRate(j.myOffer.rate)}/hr</b>. Waiting for the booker to answer.</span><button class="btn ghost small" data-act="withdraw-offer" data-id="${j.id}">Withdraw</button></div>`
     :offerOpen===j.id?`<div class="counter"><label class="meta" for="offer-${j.id}">Your hourly rate</label>
        <div class="stepper"><button type="button" class="btn ghost small" data-step="-1" data-id="${j.id}" aria-label="Lower by $1">−$1</button><input id="offer-${j.id}" class="mono" type="number" inputmode="decimal" min="5" max="200" step="0.25" value="${(offerDraft[j.id]??j.rate).toFixed(2)}"><button type="button" class="btn ghost small" data-step="1" data-id="${j.id}" aria-label="Raise by $1">+$1</button></div>
        <div class="btns"><button class="btn small" data-act="offer" data-id="${j.id}">Send offer</button><button class="btn ghost small" data-act="offer-cancel" data-id="${j.id}">Cancel</button></div></div>`
     :`<div class="btns"><button class="btn small" data-act="claim" data-id="${j.id}">Claim at ${fmtRate(j.rate)}/hr</button><button class="btn ghost small" data-act="offer-open" data-id="${j.id}">Offer a different rate</button></div>`}</article>`}).join(''):`<div class="empty">No open jobs${near.on&&near.radius?` within ${near.radius} miles`:''}${filter==='All'?'':' in this category'} right now. New ones show up here automatically.</div>`}</div>`}

const buyDraft={},soldOpen=new Set();
function waiterShifts(){
  const mine=data.shifts.slice().sort((a,b)=>(a.status==='done')-(b.status==='done'));
  const earned=mine.filter(j=>j.status==='done').reduce((s,j)=>s+billOf(j).pay,0);
  const upToSum=mine.filter(j=>j.status!=='done').reduce((s,j)=>s+waiterUpTo(j),0);
  const verbs={enroute:'I\'m on my way',inline:'I\'m in line',nearfront:'I\'m near the register',handoff:'I\'m at the front'};
  return`<div class="list"><div class="earn"><div><div class="meta">Earned so far</div><b class="mono">${money(earned)}</b></div><div class="meta">Up to ${money(upToSum)} on active shifts</div></div>
   ${mine.length?mine.map(j=>{
     const pickup=kindOf(j)==='pickup',bought=pickup&&!!j.purchasedAt,keys=keysFor(j),next=keys[keys.indexOf(j.status)+1],b=billOf(j),O=esc(j.ownerName);let ctl='',extra='';
     const secured=!PAY.enabled||j.payStatus==='held';
     if(next&&verbs[next]&&!(pickup&&next==='handoff'))ctl+=`<button class="btn small" data-act="${next==='inline'?'checkin':'advance'}" data-id="${j.id}">${next==='inline'&&!pickup?'I\'m at the spot':verbs[next]}</button>`;
     if(j.status==='claimed'||j.status==='enroute')ctl+=`<button class="btn ghost small" data-act="release" data-id="${j.id}">Release</button>`;
     if(j.status==='claimed'||j.status==='enroute')extra=`<div class="hint">Tap <b>${pickup?'I\'m in line':'I\'m at the spot'}</b> once you're there. We check your phone's location to confirm it, and that starts the clock you're paid on.</div>`;
     if(!pickup&&j.status!=='done')extra+=`<div class="rule"><b>No line-cutting.</b> ${SPOT_RULE_SHORT} If the booker asks you to hold a place in a line for them to step into, decline and contact support.</div>`;
     if(pickup&&(j.status==='inline'||j.status==='nearfront'))ctl+=`<span class="pos"><label class="meta" for="pos-${j.id}">Place in line</label><input class="mono" id="pos-${j.id}" type="number" min="1" inputmode="numeric" value="${j.pos??''}"><button class="btn ghost small" data-act="position" data-id="${j.id}">Update</button></span>`;
     if(pickup&&(j.status==='inline'||j.status==='nearfront')){
       const d=buyDraft[j.id]||{};
       if(!secured)extra+=`<div class="warnnote">Don't buy anything yet. The booker's payment isn't secured, so you might not be paid back. We've asked them to update their card.</div>`;
       else ctl+=`<div class="buybox"><b>Bought it?</b><div class="hint">Pay at the register (up to ${money(j.itemBudget)}, tax included), then enter the total and take a photo of the receipt. You're paid back with your earnings.</div>
         <div class="row2"><label class="sr" for="buy-${j.id}">Receipt total</label><input id="buy-${j.id}" type="number" inputmode="decimal" min="0.5" max="${j.itemBudget}" step="0.01" placeholder="Total $" value="${d.total??''}">
           <label class="photo-btn">${d.photo?`<img class="thumb" src="${d.photo}" alt="Receipt photo">Retake`:'📷 Receipt photo'}<input type="file" accept="image/*" capture="environment" data-photo="${j.id}"></label></div>
         <div class="row2"><label class="sr" for="bnote-${j.id}">Note</label><input type="text" id="bnote-${j.id}" maxlength="200" placeholder="Note (optional)" value="${esc(d.note||'')}"></div>
         <div class="btns"><button class="btn small" data-act="purchase" data-id="${j.id}">Record purchase</button>${soldOpen.has(j.id)?'':`<button class="btn ghost small" data-act="sold-open" data-id="${j.id}">It's sold out</button>`}</div></div>`;
       if(soldOpen.has(j.id))extra+=`<div class="confirm"><b>Mark it sold out?</b><div class="meta">${j.itemBackup?`Check the backup (${esc(j.itemBackup)}) first. `:''}The job ends and you're paid for the time you waited. Nothing is bought.</div><div class="btns"><button class="btn danger-btn small" data-act="soldout" data-id="${j.id}">Yes, it's sold out</button><button class="btn ghost small" data-act="sold-close" data-id="${j.id}">Not yet</button></div></div>`}
     if(bought&&j.status==='handoff'){
       extra+=billRows(b,'waiter');
       if(j.graceEndsAt&&nowS()>=j.graceEndsAt)extra+=`<div class="warnnote">${O} hasn't met you within 2 hours of the purchase. You can close the job and be paid in full, including the item. Keep the item safe and arrange the handover in Messages.</div><button class="btn ghost small" data-act="leave" data-id="${j.id}">Close job (booker didn't meet)</button>`;
       else if(j.graceEndsAt)extra+=`<div class="hint">If ${O} hasn't met you by ${clockOf(j.graceEndsAt)}, you can close the job and be paid in full. Message them below.</div>`}
     else if(j.status==='handoff'&&j.graceEndsAt){
       if(nowS()>=j.graceEndsAt)extra+=`<div class="warnnote">${O} hasn't swapped in within 30 minutes. You can end the shift and be paid for your time.</div><button class="btn ghost small" data-act="leave" data-id="${j.id}">End shift (booker didn't show)</button>`;
       else extra+=`<div class="hint">If ${O} doesn't swap in by ${clockOf(j.graceEndsAt)}, you can end the shift and be paid for your time. Message them below.</div>`}
     const handReady=pickup?j.status==='handoff':['inline','nearfront','handoff'].includes(j.status);
     if(handReady)ctl+=`<div class="codebox" style="width:100%"><label class="meta" for="code-${j.id}" style="width:100%">${pickup?`When you meet ${O}, ask for their 4-digit handoff code and enter it to hand over the item.`:`When ${O} arrives, ask for their 4-digit spot code and enter it to hand over the spot.`}</label><input id="code-${j.id}" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"><button class="btn small" data-act="swap" data-id="${j.id}">${pickup?'Hand it over':'Hand over spot'}</button></div>`;
     if(j.status!=='done'&&b.timeUp)extra+=`<div class="warnnote">The approved time is up. If ${O} doesn't add time, you can end the shift and be paid for the full ${fmtShort(b.approved)}.</div><button class="btn ghost small" data-act="leave" data-id="${j.id}">End shift (time's up)</button>`;

     if(j.status==='done'){ctl='';const txt=OUTCOME_TXT.waiter[j.outcome];extra=`${billRows(b,'waiter')}${txt?`<div class="hint">${txt(O)}</div>`:''}${rateHTML(j,j.ownerName,'booker')}`}
     const outfit=j.status!=='done'?`<div class="codebox"><label class="meta" for="outfit-${j.id}" style="width:100%">Optional: what you're wearing, so ${O} can spot you.</label><input id="outfit-${j.id}" style="flex:1;min-width:0;letter-spacing:0;text-align:left;font-family:var(--f-body);font-weight:500;font-size:14px" maxlength="120" value="${esc(me.look)}" placeholder="e.g. Red cap, blue jacket"><button class="btn ghost small" data-act="outfit" data-id="${j.id}">Save</button></div>`:'';
     return`<article class="card"><div class="row"><div>${kindTag(j)}<h3>${esc(j.place)}</h3>${pickup?'':`<div class="meta">${esc(j.what)}</div>`}</div>${pillFor(j)}</div>

       ${itemBox(j,'waiter')}
       ${j.status!=='done'?whoCard(j.ownerName,'Your customer · '+ratingTxt(j.ownerRating),undefined,j.ownerAvatar):''}${meterHTML(j,'waiter')}${outfit}
       ${j.notes&&j.status!=='done'?`<div class="meta">“${esc(j.notes)}”</div>`:''}${checkinNote(j)}${extra}${payNote(j,'waiter')}${facts(j,'waiter')}${ctl?`<div class="btns">${ctl}</div>`:''}${j.status!=='done'||j.chatOpen?chatHTML(j,j.ownerName):''}</article>`}).join(''):`<div class="empty">No shifts yet. Claim a job from <b>Find jobs</b>.</div>`}</div>`}

// ---------- opening sound: three rising bell notes, one per word of "Wait For Me" ----------
let audioCtx=null,chimed=false;
const soundOn=()=>store.get('wfm_sound')!=='off';
function playChime(){
  const ctx=audioCtx,t0=ctx.currentTime+0.02,master=ctx.createGain();
  master.gain.value=0.32;master.connect(ctx.destination);
  [[783.99,0,1.1],[1046.5,0.13,1.1],[1318.51,0.26,1.7]].forEach(([f,at,len])=>{
    [[1,1],[2.76,0.22],[5.4,0.07]].forEach(([mult,amp])=>{
      const o=ctx.createOscillator(),g=ctx.createGain(),t=t0+at,d=len/(mult>1?mult*0.6:1);
      o.type='sine';o.frequency.value=f*mult;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05)});
  });
}
async function tryChime(){
  if(chimed||!soundOn())return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return true;
    audioCtx=audioCtx||new AC();
    if(audioCtx.state!=='running')await Promise.race([audioCtx.resume(),new Promise(r=>setTimeout(r,250))]);
    if(audioCtx.state==='running'){chimed=true;playChime();return true}
  }catch{}
  return false;
}
// ---------- intro: logo pops up and the chime plays ----------
// Phones (iPhones especially) block sound until the screen is touched. If that happens,
// the intro waits for a tap, then plays the chime and opens the app.
(()=>{
  const intro=$('#intro'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,start=Date.now();
  const hide=()=>{if(intro.hidden||intro.classList.contains('out'))return;intro.classList.add('out');setTimeout(()=>{intro.hidden=true},reduce?0:380)};
  (async()=>{
    const played=await tryChime();
    if(played){setTimeout(hide,Math.max(0,1800-(Date.now()-start)));return}
    intro.classList.add('needs-tap');
    const go=()=>{tryChime();hide();intro.removeEventListener('click',go);removeEventListener('keydown',go)};
    intro.addEventListener('click',go);addEventListener('keydown',go);
  })();
})();

// Receipt photos: shrunk on the phone before upload so they send quickly.
async function shrinkPhoto(file){const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('That photo couldn\'t be opened. Try taking it again.'));i.src=url});
    const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.75,d=c.toDataURL('image/jpeg',q);while(d.length>1.4e6&&q>.3){q-=.15;d=c.toDataURL('image/jpeg',q)}return d}
  finally{URL.revokeObjectURL(url)}}

  try{const d=buyDraft[id]=buyDraft[id]||{};const tot=document.getElementById('buy-'+id),note=document.getElementById('bnote-'+id);if(tot)d.total=tot.value;if(note)d.note=note.value;
    d.photo=await shrinkPhoto(t.files[0]);render()}catch(err){toast(err.message)}});
$('#view').addEventListener('input',e=>{const t=e.target;if(t.id&&t.id.startsWith('buy-')){(buyDraft[+t.id.slice(4)]=buyDraft[+t.id.slice(4)]||{}).total=t.value}
  if(t.id&&t.id.startsWith('bnote-')){(buyDraft[+t.id.slice(6)]=buyDraft[+t.id.slice(6)]||{}).note=t.value}if(t.id&&t.id.startsWith('offer-')){const v=parseFloat(t.value);if(!isNaN(v))offerDraft[+t.id.slice(6)]=v}
  if(t.id&&t.id.startsWith('chat-'))chatDraft[+t.id.slice(5)]=t.value});
$('#view').addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.id&&t.id.startsWith('chat-')){e.preventDefault();const btn=t.parentElement.querySelector('[data-act=chat-send]');if(btn)btn.click()}});
// Location for check-in. Returns null if the phone can't or won't share it.
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})})}
// ---- alerts while the app is open: a short tone, a buzz, and a message ----
function alertTone(){try{if(!soundOn()||!audioCtx||audioCtx.state!=='running')return;const t=audioCtx.currentTime;
  [[880,0],[1175,.12]].forEach(([f,at])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t+at);g.gain.exponentialRampToValueAtTime(.25,t+at+.01);g.gain.exponentialRampToValueAtTime(.0001,t+at+.25);o.connect(g);g.connect(audioCtx.destination);o.start(t+at);o.stop(t+at+.3)})}catch{}}
const ALERTS={claimed:j=>`${j.waiterName} took your request at ${j.place}.`,enroute:j=>`${j.waiterName} is on the way.`,
  inline:j=>kindOf(j)==='pickup'?`${j.waiterName} is in line.`:`${j.waiterName} is saving your spot.`,
  nearfront:j=>kindOf(j)==='pickup'?`${j.waiterName} is almost at the register.`:`${j.waiterName} is almost at the front. Head over now.`,
  handoff:j=>kindOf(j)==='pickup'?`${j.waiterName} bought your item for ${money(j.itemTotal)}. Time to meet up.`:`${j.waiterName} is at the front. Time to swap in.`};
function notifyChanges(prev,next){
  if(!prev)return;const msgs=[];
  for(const j of next.mine){const p=prev.mine.find(x=>x.id===j.id);if(!p)continue;
    if(p.status!==j.status&&ALERTS[j.status]&&j.waiterId)msgs.push(ALERTS[j.status](j));
    if(p.status==='open'&&j.status==='open'&&(j.offers||[]).length>(p.offers||[]).length)msgs.push(`New rate offer on ${j.place}.`);
    if((j.unread||0)>(p.unread||0)&&!chatOpen.has(j.id))msgs.push(`New message from ${j.waiterName}.`)}
  for(const j of next.shifts){const p=prev.shifts.find(x=>x.id===j.id);
    if(!p){msgs.push(`You're booked for ${j.place}.`);continue}
    if(p.status!=='done'&&j.status==='done'&&/^cancelled/.test(j.outcome||''))msgs.push(`${j.ownerName} cancelled ${j.place}.`);
    if((j.unread||0)>(p.unread||0)&&!chatOpen.has(j.id))msgs.push(`New message from ${j.ownerName}.`)}
  for(const p of prev.shifts)if(p.status!=='done'&&!next.shifts.some(x=>x.id===p.id))msgs.push(`You were removed from ${p.place} because you didn't check in on time.`);
  if(msgs.length){toast(msgs[msgs.length-1]);alertTone();try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch{}}}

// ---------- data ----------
async function load(force){
  if(!me)return;
  const t0=Date.now();
  const [m1,o1,s1,info]=await Promise.all([...['mine','open','shifts'].map(s=>api('/lines?scope='+s)),api('/me')]);
  clockSkew=m1.now-Math.round((t0+Date.now())/2);
  const mine=m1.lines,open=o1.lines,shifts=s1.lines;
  if(info.user){me=info.user;myRatings=info.ratings;TAGS=info.tags||TAGS;if(info.payments)PAY=info.payments}
  await Promise.all([...chatOpen].map(loadChat));
  paintChats();
  notifyChanges(lastData,{mine,open,shifts});lastData={mine,open,shifts};
  // The clock fields change every refresh; leave them out when deciding whether to redraw.
  const json=JSON.stringify([mine,open,shifts,myRatings,chatData],(k,v)=>k==='waitedHours'||k==='timeUp'?undefined:v);
  if(!force&&json===lastJSON)return;
  if(!force&&cardOpen&&tab[role]==='account')return; // keep the card form in place while it's open
  // Don't redraw while someone is typing in the page; the next check picks it up.
  const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!force&&typing)return;
  // Keep a half-filled Post form intact; just refresh the tab badges.
  if(!force&&role==='customer'&&tab.customer==='post'){data={mine,open,shifts};lastJSON=json;renderTabs();return}
  data={mine,open,shifts};lastJSON=json;render();
}
setInterval(()=>{if(me&&document.visibilityState==='visible')load(false).catch(()=>{})},5000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load(false).catch(()=>{})});

(async()=>{
  try{const info=await api('/me');me=info.user;if(info.payments)PAY=info.payments}catch{me=null}
  // Coming back from Stripe (payout setup, or a card that needed bank confirmation).
  const q=new URLSearchParams(location.search);
  if(q.has('payouts')||q.has('setup_intent')||q.has('card'))history.replaceState(null,'',location.pathname);
  if(me&&q.has('payouts')){tab[role]='account';try{const r=await api('/payments/payouts/refresh',{method:'POST'});me=r.user;
    toast(r.status.ready?'Payouts are on. You can claim lines now.':r.status.needsInfo?'Payout setup isn\'t finished yet. Tap Finish payout setup.':'Thanks. Stripe is reviewing your details.')}catch(err){toast(err.message)}}
  if(me&&q.get('setup_intent')){tab[role]='account';try{if(q.get('redirect_status')==='succeeded')await finishCard(q.get('setup_intent'));else toast("The card wasn't added. Try again.")}catch(err){toast(err.message)}}
  if(me){try{await load(true)}catch(err){toast(err.message);render()}}else render();
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}
